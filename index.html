<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Horário de Saída</title>
    <!-- Bootstrap CSS e Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }
        .calculator-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .input-group-text {
            background-color: #f8f9fa;
            border-color: #dee2e6;
        }
        .form-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 0.2rem rgba(118, 75, 162, 0.25);
        }
        .btn-calculate {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 12px;
            transition: transform 0.2s;
        }
        .btn-calculate:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #764ba2, #667eea);
        }
        .icon-title {
            color: #764ba2;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator-container">
            <h1 class="text-center mb-4">
                <i class="bi bi-clock icon-title"></i>
                Calculadora de Horário
            </h1>
            
            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-gear-fill me-2"></i>
                    Configuração da Jornada
                </label>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="number" class="form-control" id="jornada" value="8" min="1" max="12">
                            <span class="input-group-text">horas</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="number" class="form-control" id="ajuste_horas" value="0" min="-12" max="12" step="0.5">
                            <span class="input-group-text">horas ajuste</span>
                        </div>
                        <div class="form-text" id="ajuste_info">Use valores positivos para horas extras ou negativos para sair mais cedo</div>
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="entrada" class="form-label">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Horário de Entrada
                </label>
                <input type="time" class="form-control" id="entrada" required>
            </div>
            
            <div class="mb-3">
                <label for="saida_almoco" class="form-label">
                    <i class="bi bi-cup-hot me-2"></i>
                    Saída para Almoço
                </label>
                <input type="time" class="form-control" id="saida_almoco" required>
            </div>
            
            <div class="mb-3">
                <label for="retorno_almoco" class="form-label">
                    <i class="bi bi-arrow-return-left me-2"></i>
                    Retorno do Almoço
                </label>
                <input type="time" class="form-control" id="retorno_almoco" required>
            </div>
            
            <div class="mb-4">
                <label for="horario_saida" class="form-label">
                    <i class="bi bi-box-arrow-right me-2"></i>
                    Horário de Saída
                </label>
                <input type="time" class="form-control bg-light" id="horario_saida" readonly>
            </div>
            
            <div class="d-grid">
                <button onclick="calcularHorarioSaida()" class="btn btn-primary btn-lg btn-calculate">
                    <i class="bi bi-calculator me-2"></i>
                    Calcular Horário de Saída
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.calcularHorarioSaida = function() {
            // Obter valores dos inputs
            const entrada = document.getElementById('entrada').value;
            const saidaAlmoco = document.getElementById('saida_almoco').value;
            const retornoAlmoco = document.getElementById('retorno_almoco').value;

            if (!entrada || !saidaAlmoco || !retornoAlmoco) {
                alert('Por favor, preencha todos os horários!');
                return;
            }

            // Converter strings de tempo para objetos Date
            const hoje = new Date();
            const [horaEntrada, minEntrada] = entrada.split(':');
            const [horaSaidaAlmoco, minSaidaAlmoco] = saidaAlmoco.split(':');
            const [horaRetorno, minRetorno] = retornoAlmoco.split(':');

            const dataEntrada = new Date(hoje.setHours(horaEntrada, minEntrada, 0));
            const dataSaidaAlmoco = new Date(hoje.setHours(horaSaidaAlmoco, minSaidaAlmoco, 0));
            const dataRetornoAlmoco = new Date(hoje.setHours(horaRetorno, minRetorno, 0));

            // Calcular tempo de almoço em minutos
            const tempoAlmoco = (dataRetornoAlmoco - dataSaidaAlmoco) / (1000 * 60);

            // Obter jornada e ajuste de horas
            const jornada = parseInt(document.getElementById('jornada').value) || 8;
            const ajusteHoras = parseFloat(document.getElementById('ajuste_horas').value) || 0;
            const totalHoras = jornada + ajusteHoras;

            // Atualizar mensagem de ajuste
            const ajusteInfo = document.getElementById('ajuste_info');
            if (ajusteHoras > 0) {
                ajusteInfo.textContent = `Fazendo ${ajusteHoras} hora(s) extra(s)`;
                ajusteInfo.className = 'form-text text-success';
            } else if (ajusteHoras < 0) {
                ajusteInfo.textContent = `Saindo ${Math.abs(ajusteHoras)} hora(s) mais cedo`;
                ajusteInfo.className = 'form-text text-danger';
            } else {
                ajusteInfo.textContent = 'Jornada normal';
                ajusteInfo.className = 'form-text text-muted';
            }

            // Calcular horário de saída (entrada + jornada + ajuste + tempo de almoço)
            const dataSaida = new Date(dataEntrada.getTime() + (totalHoras * 60 * 60 * 1000) + (tempoAlmoco * 60 * 1000));

            // Formatar horário de saída
            const horarioSaida = `${dataSaida.getHours().toString().padStart(2, '0')}:${dataSaida.getMinutes().toString().padStart(2, '0')}`;

            // Exibir resultado no input
            document.getElementById('horario_saida').value = horarioSaida;
        };
    </script>
</body>
</html>
